# Co-author links rendered in the bibliography.
#
# Keys MUST be the last name, lower cased and with accents stripped: _layouts/bib.liquid computes
# `author.last | downcase | remove_accents` and looks the result up here. So Günnemann -> gunnemann,
# Zügner -> zugner, Wollschläger -> wollschlager. The `latex` bibtex filter runs first, so the two
# spellings in papers.bib (G{\"u}nnemann and G{\"{u}}nnemann) both collapse to the same key.
#
# `firstname` is a list of spellings that should match; the entry is used only when one of them
# equals the first name as parsed from the BibTeX author field. List every variant that appears.
#
# Only co-authors whose page could be confirmed are listed. Add the rest as you find them — see the
# commented block at the bottom for the names still missing.

"gunnemann":
